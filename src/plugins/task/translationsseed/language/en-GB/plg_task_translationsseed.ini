PLG_TASK_TRANSLATIONSSEED="Task - Translations Seed"
PLG_TASK_TRANSLATIONSSEED_XML_DESCRIPTION="Seeds translation rules from an installed language pack, so a site starts with the terminology its language team already agreed on."
PLG_TASK_TRANSLATIONSSEED_TITLE="Seed Translation Rules From a Language Pack"
PLG_TASK_TRANSLATIONSSEED_DESC="Translates the strings of an installed language pack without using any rules, pairs each against the translation the pack already carries, and records the differences as translator feedback for the distiller. Each run sends requests until its time is used up; the next run carries on."
PLG_TASK_TRANSLATIONSSEED_TARGET_LANGUAGE_LABEL="Language"
PLG_TASK_TRANSLATIONSSEED_TARGET_LANGUAGE_DESC="The installed language to learn from. Its pack supplies the approved translations."
PLG_TASK_TRANSLATIONSSEED_REQUEST_SIZE_LABEL="Strings per Request"
PLG_TASK_TRANSLATIONSSEED_REQUEST_SIZE_DESC="The most distinct texts sent to the provider in one request. A text that occurs in several language files is sent once. A request that fails is retried at half this size."
PLG_TASK_TRANSLATIONSSEED_TIME_BUDGET_LABEL="Time per Run (seconds)"
PLG_TASK_TRANSLATIONSSEED_TIME_BUDGET_DESC="How long one run may keep sending requests; the run stops before a request that would probably not finish in time, and the next run carries on. 0 means 25 seconds over the web and 240 seconds from the command line. With Web Cron called every minute, 110 is a good value when your hosting lets a web request run about two minutes. Keep the Task Timeout in the Scheduled Tasks options well above it, for example 600."
PLG_TASK_TRANSLATIONSSEED_FILES_LABEL="Language Files"
PLG_TASK_TRANSLATIONSSEED_FILES_DESC="A comma separated list of language file names to read, such as com_content.ini. Leave empty to read the whole pack."
PLG_TASK_TRANSLATIONSSEED_LOG_NO_COMPONENT="The Translations component is not installed or not enabled, so there is nowhere to record what is seeded."
PLG_TASK_TRANSLATIONSSEED_LOG_NO_LANGUAGE="No language is selected, so there is no pack to learn from."
PLG_TASK_TRANSLATIONSSEED_LOG_BUSY="Another seed run for the %s pack is still busy, so this run did nothing; the pending strings are left to that run."
PLG_TASK_TRANSLATIONSSEED_LOG_NONE="Nothing left to seed from the %s pack."
PLG_TASK_TRANSLATIONSSEED_LOG_SEEDED="Seeded %1$d strings from the %2$s pack; %3$d still pending."
PLG_TASK_TRANSLATIONSSEED_LOG_FAILED="%1$d strings could not be seeded; %2$d of them failed for the third time and are set aside. Last error: %3$s"
PLG_TASK_TRANSLATIONSSEED_RESETFAILED_TITLE="Retry Failed Language Pack Strings"
PLG_TASK_TRANSLATIONSSEED_RESETFAILED_DESC="Gives the language pack strings that the seed task set aside after three failed attempts a new set of attempts. Run it once the cause of the failures is fixed, such as an invalid model or an empty credit balance."
PLG_TASK_TRANSLATIONSSEED_RESETFAILED_LOG="%d failed strings will be seeded again."
PLG_TASK_TRANSLATIONSSEED_FORGET_TITLE="Forget a Seeded Language"
PLG_TASK_TRANSLATIONSSEED_FORGET_DESC="Forgets what the seed task did for one language, so its pack can be seeded again from scratch: the record of which strings were seeded and the feedback the seed task wrote are deleted, and the unpublished rules learned only from the pack are moved to the trash. Published rules are kept unless you choose otherwise; feedback and rules from translators are always kept. The deletions cannot be undone."
PLG_TASK_TRANSLATIONSSEED_FORGET_LANGUAGE_LABEL="Language"
PLG_TASK_TRANSLATIONSSEED_FORGET_LANGUAGE_DESC="The language whose seeding is forgotten."
PLG_TASK_TRANSLATIONSSEED_FORGET_LOG="Forgot the seeding of %1$s: %2$d strings will be seeded again, %3$d feedback rows were deleted and %4$d rules moved to the trash."
PLG_TASK_TRANSLATIONSSEED_FORGET_INCLUDE_PUBLISHED_LABEL="Also Trash Published Rules"
PLG_TASK_TRANSLATIONSSEED_FORGET_INCLUDE_PUBLISHED_DESC="Also move the published rules learned from this language pack to the trash. Leave this off unless you are sure: published rules were reviewed by someone and are in use for every translation into this language."
PLG_TASK_TRANSLATIONSSEED_FORGET_INCLUDE_PUBLISHED_WARNING="<strong>Be very careful with this option.</strong> Published rules have been reviewed and steer every new translation into this language. With this option on, all published rules learned from the language pack are moved to the trash and stop being used at once. Rules that came from translators are not affected. You can restore trashed rules from the trash in the Rules view, as long as the trash has not been emptied."
