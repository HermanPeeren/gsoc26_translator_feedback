PLG_TASK_TRANSLATIONSTRANSLATE="Task - Translations Translate"
PLG_TASK_TRANSLATIONSTRANSLATE_XML_DESCRIPTION="Translates the items waiting in the Translations queue on a schedule."
PLG_TASK_TRANSLATIONSTRANSLATE_TITLE="Translate Queued Items"
PLG_TASK_TRANSLATIONSTRANSLATE_DESC="Creates a translation draft for each item waiting on one, ready for a translator to review. Each run translates items until its batch or its time is used up; the next run carries on. An item too long to translate in one request is translated in parts over as many runs as it takes, and the parts done are kept in between. An item that fails three times is set aside and not sent again."
PLG_TASK_TRANSLATIONSTRANSLATE_BATCH_LABEL="Batch Size"
PLG_TASK_TRANSLATIONSTRANSLATE_BATCH_DESC="The most items translated in one run. Each one is at least one request to the translation provider, and a long item is several, so a large batch makes a long run."
PLG_TASK_TRANSLATIONSTRANSLATE_TIME_BUDGET_LABEL="Time per Run (seconds)"
PLG_TASK_TRANSLATIONSTRANSLATE_TIME_BUDGET_DESC="How long one run may keep sending requests; the run stops before a request that would probably not finish in time, and the next run carries on. 0 means 25 seconds over the web and 240 seconds from the command line. With Web Cron called every minute, 110 is a good value when your hosting lets a web request run about two minutes. Keep the Task Timeout in the Scheduled Tasks options well above it, for example 600."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_BUSY="Another translate run is still busy, so this run did nothing; the waiting items are left to that run."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_NONE="Nothing is waiting on a translation."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_ADVANCED="Translated %d parts of items too long to translate in one request; the next runs carry on with the rest."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_TRANSLATED="Created %1$d translation drafts; %2$d items still waiting."
PLG_TASK_TRANSLATIONSTRANSLATE_LOG_FAILED="%1$d items could not be translated; %2$d of them failed for the third time and are set aside. Last error: %3$s"
PLG_TASK_TRANSLATIONSTRANSLATE_RESETFAILED_TITLE="Retry Failed Translations"
PLG_TASK_TRANSLATIONSTRANSLATE_RESETFAILED_DESC="Gives the translations that the translate task set aside after three failed attempts a new set of attempts. Run it once the cause of the failures is fixed, such as an invalid model or an empty credit balance."
PLG_TASK_TRANSLATIONSTRANSLATE_RESETFAILED_LOG="%d failed translations are pending again."
