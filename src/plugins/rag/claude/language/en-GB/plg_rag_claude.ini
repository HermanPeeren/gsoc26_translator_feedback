PLG_RAG_CLAUDE="RAG - Claude"
PLG_RAG_CLAUDE_XML_DESCRIPTION="Distils translation rules from translator feedback for the Translations component using the Anthropic Claude API."
PLG_RAG_CLAUDE_FIELD_API_KEY_LABEL="API key"
PLG_RAG_CLAUDE_FIELD_API_KEY_DESC="Your Anthropic API key, required to distil rules. Create one at console.anthropic.com."
PLG_RAG_CLAUDE_FIELD_MODEL_LABEL="Model"
PLG_RAG_CLAUDE_FIELD_MODEL_DESC="The Claude model used to distil rules. It can differ from the model the translation plugin uses."
PLG_RAG_CLAUDE_FIELD_EFFORT_LABEL="Effort"
PLG_RAG_CLAUDE_FIELD_EFFORT_DESC="How much the model may think before it answers. Low is the cheapest and fastest and keeps the rules that several corrections support; higher effort adds more rules that rest on a single correction, at several times the cost. Haiku takes no effort level, so this is ignored for it."
PLG_RAG_CLAUDE_FIELD_EFFORT_LOW="Low"
PLG_RAG_CLAUDE_FIELD_EFFORT_MEDIUM="Medium"
PLG_RAG_CLAUDE_FIELD_EFFORT_HIGH="High"
PLG_RAG_CLAUDE_FIELD_TIMEOUT_LABEL="Timeout (seconds)"
PLG_RAG_CLAUDE_FIELD_TIMEOUT_DESC="How long to wait for an answer before a request counts as failed. A run started over the web can still be cut off earlier by the web server."
